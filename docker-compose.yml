# TP CloudTrail - environnement local et gratuit (emulateur : Floci)
#
#   docker compose up -d --build     # demarre Floci + conteneur "lab"
#   docker compose exec lab bash     # shell avec AWS CLI + Python
#
# NOTE : Floci emule CloudTrail (trails, StartLogging, fichiers .json.gz dans S3).
#        Ce n'est PAS le vrai service AWS : a mentionner dans le rapport.
services:
  floci:
    image: ${FLOCI_IMAGE:-floci/floci:latest}
    container_name: lab-floci
    ports:
      - "127.0.0.1:4566:4566"        # expose uniquement sur la machine locale
    environment:
      - FLOCI_HOSTNAME=floci
      - FLOCI_STORAGE_MODE=persistent
      - FLOCI_STORAGE_PERSISTENT_PATH=/app/data
      - FLOCI_SERVICES_IAM_ENFORCEMENT_ENABLED=true
    volumes:
      - floci_data:/app/data

  lab:
    build: .
    container_name: lab-shell
    working_dir: /lab
    depends_on:
      - floci
    volumes:
      - .:/lab
    environment:
      - AWS_ACCESS_KEY_ID=test         # identifiants FACTICES
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=${LAB_REGION:-eu-west-3}
      - AWS_PAGER=
      - LAB_ENDPOINT=${LAB_ENDPOINT:-http://floci:4566}
      - AWS_ENDPOINT_URL=${LAB_ENDPOINT:-http://floci:4566}
    command: ["sleep", "infinity"]

volumes:
  floci_data: